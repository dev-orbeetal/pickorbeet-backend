      <div style="font-size:12px;line-height:16px;color:#8B95A8;">Order ID</div>
      <div style="font-size:14px;line-height:18px;font-weight:700;color:#172033;padding-top:3px;">{{ order_number }}</div>
    </td>
    <td width="50%" valign="top" style="font-family:{{ font }};">
      <div style="font-size:12px;line-height:16px;color:#8B95A8;">{{ meta_label }}</div>
      <div style="font-size:14px;line-height:18px;font-weight:700;color:#172033;padding-top:3px;">{{ meta_value }}</div>
    </td>
  </tr>
</table>
