<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td width="72" valign="middle" style="padding:12px 0;">
      <a href="{{ item.url }}" style="text-decoration:none;">
        <img src="{{ item.image }}" width="64" height="64" alt="" style="display:block;width:64px;height:64px;border-radius:12px;background-color:#F4F7FC;border:0;">
      </a>
    </td>
    <td valign="middle" style="padding:12px 10px;font-family:{{ font }};">
      <div style="font-size:14px;line-height:18px;font-weight:700;color:#172033;">{{ item.name }}</div>
      {% if item.meta %}
      <div style="font-size:12px;line-height:16px;color:#687386;padding-top:3px;">{{ item.meta }}</div>
      {% endif %}
    </td>
    <td valign="middle" align="right" style="padding:12px 0;font-family:{{ font }};white-space:nowrap;">
      <div style="font-family:{{ money_font }};font-size:15px;line-height:18px;font-weight:800;color:#172033;">{{ item.price }}</div>
      {% if item.compare %}
      <div style="font-family:{{ money_font }};font-size:12px;line-height:16px;color:#A3A8B3;text-decoration:line-through;padding-top:2px;">{{ item.compare }}</div>
      {% endif %}
    </td>
  </tr>
</table>
